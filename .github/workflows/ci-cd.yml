name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"
  POETRY_VERSION: "2.4.1"

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}
      - name: Install dependencies
        run: poetry install --no-root --no-interaction --no-ansi
      - name: Run Ruff linter
        run: poetry run ruff check .
      - name: Run Ruff formatter check
        run: poetry run ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      DJANGO_SETTINGS_MODULE: config.settings_ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: lacrei_test
      POSTGRES_USER: lacrei
      POSTGRES_PASSWORD: lacrei
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lacrei_test
          POSTGRES_USER: lacrei
          POSTGRES_PASSWORD: lacrei
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lacrei -d lacrei_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}
      - name: Install dependencies
        run: poetry install --no-root --no-interaction --no-ansi
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -U lacrei -d lacrei_test && break
            echo "Aguardando PostgreSQL... tentativa $i/30"
            sleep 2
          done
      - name: Run migrations
        run: poetry run python manage.py migrate --noinput
      - name: Run tests with coverage
        run: poetry run python -m pytest --ds=config.settings_ci --cov=. --cov-report=xml --cov-report=term -v
      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          flags: unittests
