name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"
  POETRY_VERSION: "2.4.1"

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}
      - name: Install dependencies
        run: poetry install --no-root --no-interaction --no-ansi
      - name: Run Ruff linter
        run: poetry run ruff check .
      - name: Run Ruff formatter check
        run: poetry run ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      DJANGO_SETTINGS_MODULE: config.settings_ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: lacrei_test
      POSTGRES_USER: lacrei
      POSTGRES_PASSWORD: lacrei
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lacrei_test
          POSTGRES_USER: lacrei
          POSTGRES_PASSWORD: lacrei
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lacrei -d lacrei_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}
      - name: Install dependencies
        run: poetry install --no-root --no-interaction --no-ansi
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -U lacrei -d lacrei_test && break
            echo "Aguardando PostgreSQL... tentativa $i/30"
            sleep 2
          done
      - name: Run migrations
        run: poetry run python manage.py migrate --noinput
      - name: Run tests with coverage
        run: poetry run python -m pytest --ds=config.settings_ci --cov=. --cov-report=xml --cov-report=term -v
      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          flags: unittests

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t lacrei-saude-api:${{ github.sha }} .
      - name: Save Docker image
        run: docker save lacrei-saude-api:${{ github.sha }} | gzip > lacrei-saude-api.tar.gz
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: lacrei-saude-api.tar.gz
          retention-days: 7

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load Docker image
        run: docker load < lacrei-saude-api.tar.gz
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STAGING }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Push to ECR
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin ${{ secrets.AWS_ECR_REGISTRY }}
          docker tag lacrei-saude-api:${{ github.sha }} ${{ secrets.AWS_ECR_REGISTRY }}/lacrei-saude-api:staging-${{ github.sha }}
          docker push ${{ secrets.AWS_ECR_REGISTRY }}/lacrei-saude-api:staging-${{ github.sha }}
      - name: Deploy to ECS (Staging)
        run: |
          aws ecs update-service --cluster lacrei-staging --service lacrei-api-staging --force-new-deployment
      - name: Wait for deployment
        run: |
          aws ecs wait services-stable --cluster lacrei-staging --services lacrei-api-staging

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load Docker image
        run: docker load < lacrei-saude-api.tar.gz
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PRODUCTION }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PRODUCTION }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Push to ECR
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin ${{ secrets.AWS_ECR_REGISTRY }}
          docker tag lacrei-saude-api:${{ github.sha }} ${{ secrets.AWS_ECR_REGISTRY }}/lacrei-saude-api:production-${{ github.sha }}
          docker push ${{ secrets.AWS_ECR_REGISTRY }}/lacrei-saude-api:production-${{ github.sha }}
      - name: Deploy to ECS (Production - Blue/Green)
        run: |
          aws ecs update-service --cluster lacrei-production --service lacrei-api-production --force-new-deployment
      - name: Wait for deployment
        run: |
          aws ecs wait services-stable --cluster lacrei-production --services lacrei-api-production
