name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-preview:
    name: Preview PR #${{ github.event.number }}
    runs-on: ubuntu-latest
    environment:
      name: preview/pr-${{ github.event.number }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t lacrei-saude-api:pr-${{ github.event.number }} .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Push to ECR
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin ${{ secrets.AWS_ECR_REGISTRY }}
          docker tag lacrei-saude-api:pr-${{ github.event.number }} ${{ secrets.AWS_ECR_REGISTRY }}/lacrei-saude-api:pr-${{ github.event.number }}
          docker push ${{ secrets.AWS_ECR_REGISTRY }}/lacrei-saude-api:pr-${{ github.event.number }}

      - name: Deploy to ECS Preview
        run: |
          aws ecs update-service \
            --cluster lacrei-preview \
            --service "lacrei-api-pr-${{ github.event.number }}" \
            --force-new-deployment || echo "Preview service não existe ainda — criar via Terraform"

      - name: Comment PR with Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = `http://lacrei-api-pr-${{ github.event.number }}.elb.amazonaws.com/api/v1/health/`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 **Preview deploy iniciado**\nHealth check: ${url}\nSwagger: http://lacrei-api-pr-${{ github.event.number }}.elb.amazonaws.com/api/v1/docs/swagger/`
            });

  cleanup-preview:
    name: Cleanup Preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Destroy Preview Service
        run: |
          aws ecs update-service \
            --cluster lacrei-preview \
            --service "lacrei-api-pr-${{ github.event.number }}" \
            --desired-count 0 || true
          aws ecs delete-service \
            --cluster lacrei-preview \
            --service "lacrei-api-pr-${{ github.event.number }}" \
            --force || true
